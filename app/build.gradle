plugins {
    id 'com.android.application'
}

android {
    namespace 'com.openai.chdbatch'
    compileSdk 35

    defaultConfig {
        applicationId 'com.openai.chdbatch'
        minSdk 30
        targetSdk 35
        versionCode 1
        versionName '1.0'
        ndk {
            abiFilters 'arm64-v8a'
        }
    }

    packagingOptions {
        jniLibs {
            useLegacyPackaging true
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }
}
