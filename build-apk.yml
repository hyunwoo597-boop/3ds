name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Install Android SDK packages
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Download pinned Android ARM64 CHDMan
        run: |
          set -euxo pipefail
          mkdir -p app/src/main/jniLibs/arm64-v8a
          curl -fL --retry 3 \
            "https://raw.githubusercontent.com/ItsRetroPup/Mimir/db402456cd7c7418da41ff0ef8dabacc6a9e77f2/app/src/main/jniLibs/arm64-v8a/libchdman.so" \
            -o app/src/main/jniLibs/arm64-v8a/libchdman.so
          actual="$(git hash-object app/src/main/jniLibs/arm64-v8a/libchdman.so)"
          expected="c45280d4721a7440ec3c3b520a369b316043069e"
          test "$actual" = "$expected"
          chmod +x app/src/main/jniLibs/arm64-v8a/libchdman.so

      - name: Fetch GPL license text
        run: |
          curl -fL --retry 3 \
            "https://raw.githubusercontent.com/mamedev/mame/ecf0add29f06ba131994dca5b88c3a0edf6c2ad8/COPYING" \
            -o app/src/main/assets/licenses/MAME-GPL-2.0.txt

      - name: Build debug APK
        run: gradle --no-daemon assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: CHD-Batch-Converter-Android
          path: app/build/outputs/apk/debug/app-debug.apk
