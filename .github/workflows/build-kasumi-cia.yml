# Kasumi 1.1.2 한국어판 CIA 빌드 (GitHub Actions)
#
# 사용법: 저장소 루트에 Kasumi_1.1.2_Korean_Source.zip 을 올리면 자동 빌드되고,
# Actions 탭 -> "Build Kasumi KO CIA" -> Run workflow 로 수동 실행도 됩니다.
# 완료되면 Releases(또는 해당 실행의 Artifacts)에서 Kasumi.cia 를 받습니다.

name: Build Kasumi KO CIA

on:
  workflow_dispatch:
  push:
    paths:
      - 'Kasumi*.zip'
      - '.github/workflows/build-kasumi-cia.yml'

permissions:
  contents: write

defaults:
  run:
    shell: bash

jobs:
  build:
    runs-on: ubuntu-latest
    container: devkitpro/devkitarm:latest
    env:
      DEVKITPRO: /opt/devkitpro
      DEVKITARM: /opt/devkitpro/devkitARM
    steps:
      - uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          set -eu
          apt-get update
          apt-get install -y --no-install-recommends cmake make g++ git python3 unzip ca-certificates
          dkp-pacman -Syu --noconfirm --needed 3ds-dev 3ds-curl 3ds-jansson 3ds-mbedtls 3ds-libopus 3ds-zlib
          ls -l /opt/devkitpro/tools/bin/tex3ds /opt/devkitpro/tools/bin/picasso
          # Container steps are not login shells, so add the devkitPro tools to PATH.
          echo "/opt/devkitpro/devkitARM/bin" >> "$GITHUB_PATH"
          echo "/opt/devkitpro/tools/bin" >> "$GITHUB_PATH"
          /opt/devkitpro/devkitARM/bin/arm-none-eabi-gcc --version | head -n 1

      # makerom / bannertool are not part of the devkitarm image, and the
      # original bannertool repository is gone, so build both from pinned sources.
      - name: Build makerom and bannertool from source
        run: |
          set -euo pipefail
          mkdir -p "$HOME/tools"
          cd "$HOME/tools"
          fetch_commit() {
            mkdir "$1"
            git -C "$1" init -q
            git -C "$1" remote add origin "$2"
            git -C "$1" fetch -q --depth 1 origin "$3"
            git -C "$1" checkout -q FETCH_HEAD
          }

          # makerom (Project_CTR)
          fetch_commit ctr https://github.com/3DSGuy/Project_CTR d52c2b0e788c2d085763d7c5dcc4b2edd9ffb7d8
          make -C ctr/makerom deps -j4
          make -C ctr/makerom -j4
          test -x ctr/makerom/bin/makerom

          # bannertool (carstene1ns fork of Steveice10's tool). Its CMake file
          # wants 3.28, so compile it directly; flags mirror its CMakeLists.txt.
          fetch_commit bt https://github.com/carstene1ns/3ds-bannertool 734d33be79fd3f8c29c6296158f06ac7c5ca9dcb
          cd bt
          mkdir -p out
          for lib in stb_image stb_vorbis dr_wav; do
            g++ -std=c++17 -O2 -Isource/pc -c "source/pc/$lib.cpp" -o "out/$lib.o"
          done
          app_flags="-std=c++17 -O2 -Isource -Isource/pc -DVERSION=\"1.2.3\" -DSTBI_ONLY_PNG -DSTBI_NO_LINEAR -DSTBI_NO_STDIO -DSTB_VORBIS_NO_PUSHDATA_API -DSTB_VORBIS_NO_STDIO -DDR_WAV_NO_STDIO"
          for src in main log types utils 3ds/cbmd 3ds/cwav 3ds/lz11; do
            g++ $app_flags -c "source/$src.cpp" -o "out/$(basename "$src").o"
          done
          g++ out/*.o -o out/bannertool
          test -x out/bannertool

          echo "MAKEROM=$HOME/tools/ctr/makerom/bin/makerom" >> "$GITHUB_ENV"
          echo "BANNERTOOL=$HOME/tools/bt/out/bannertool" >> "$GITHUB_ENV"
          # Printing the usage text makes bannertool exit non-zero; that is fine.
          out/bannertool 2>&1 | head -n 3 || true

      - name: Extract Korean source zip
        run: |
          set -eu
          cd "$GITHUB_WORKSPACE"
          zip=$(ls Kasumi*.zip 2>/dev/null | head -n 1 || true)
          [ -n "$zip" ] || { echo "::error::저장소 루트에 Kasumi 소스 zip이 없습니다"; exit 1; }
          mkdir -p work
          unzip -q "$zip" -d work
          makefile=$(find work -maxdepth 2 -name Makefile | head -n 1)
          [ -n "$makefile" ] || { echo "::error::zip 안에서 Makefile을 찾지 못했습니다"; exit 1; }
          echo "SRC=$(cd "$(dirname "$makefile")" && pwd)" >> "$GITHUB_ENV"

      - name: Adapt Windows paths for Linux
        run: |
          set -eu
          cd "$SRC"
          # The transport scripts were written for devkitPro MSYS on Windows.
          sed -i 's#/c/devkitPro#/opt/devkitpro#g; s#C:/devkitPro#/opt/devkitpro#g; s#\.exe\b##g' \
            tools/build-transport.sh tools/transport-toolchain.cmake
          # A newer devkitARM GCC can add warnings the author's version did not
          # have; do not let those stop the build.
          sed -i 's/ -Werror//' Makefile
          grep -n 'devkitpro\|devkitPro' tools/build-transport.sh tools/transport-toolchain.cmake

      - name: Build WebRTC transport and echo canceller
        run: |
          set -eu
          cd "$SRC"
          bash tools/build-transport.sh
          bash tools/build-aecm.sh

      - name: Build 3DSX and CIA
        run: |
          set -eu
          cd "$SRC"
          make -j4
          make cia MAKEROM="$MAKEROM" BANNERTOOL="$BANNERTOOL"
          ls -l Kasumi.cia Kasumi.3dsx
          sha256sum Kasumi.cia Kasumi.3dsx

      - uses: actions/upload-artifact@v4
        with:
          name: Kasumi-KO
          if-no-files-found: error
          path: |
            ${{ env.SRC }}/Kasumi.cia
            ${{ env.SRC }}/Kasumi.3dsx

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: kasumi-ko-build-${{ github.run_number }}
          name: Kasumi 1.1.2 한국어 (build ${{ github.run_number }})
          files: |
            ${{ env.SRC }}/Kasumi.cia
            ${{ env.SRC }}/Kasumi.3dsx
