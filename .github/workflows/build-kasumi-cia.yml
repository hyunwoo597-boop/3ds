# Kasumi 1.1.2 한국어판 CIA 빌드 (GitHub Actions)
#
# 사용법: 저장소 루트에 Kasumi_1.1.2_Korean_Source.zip 을 올리면 자동 빌드되고,
# Actions 탭 -> "Build Kasumi KO CIA" -> Run workflow 로 수동 실행도 됩니다.
# 완료되면 Releases(또는 해당 실행의 Artifacts)에서 Kasumi.cia 를 받습니다.

name: Build Kasumi KO CIA

on:
  workflow_dispatch:
  push:
    paths:
      - 'Kasumi*.zip'
      - '.github/workflows/build-kasumi-cia.yml'

permissions:
  contents: write

defaults:
  run:
    shell: bash

jobs:
  build:
    runs-on: ubuntu-latest
    container: devkitpro/devkitarm:latest
    env:
      DEVKITPRO: /opt/devkitpro
      DEVKITARM: /opt/devkitpro/devkitARM
    steps:
      - uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          set -eu
          apt-get update
          apt-get install -y --no-install-recommends cmake make python3 unzip curl jq ca-certificates
          dkp-pacman -Syu --noconfirm --needed 3ds-dev 3ds-curl 3ds-jansson 3ds-mbedtls 3ds-libopus 3ds-zlib
          ls -l /opt/devkitpro/tools/bin/tex3ds /opt/devkitpro/tools/bin/picasso
          # Container steps are not login shells, so add the devkitPro tools to PATH.
          echo "/opt/devkitpro/devkitARM/bin" >> "$GITHUB_PATH"
          echo "/opt/devkitpro/tools/bin" >> "$GITHUB_PATH"
          /opt/devkitpro/devkitARM/bin/arm-none-eabi-gcc --version | head -n 1

      # makerom / bannertool are not part of the devkitarm image.
      - name: Fetch makerom and bannertool
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p "$HOME/tools"
          cd "$HOME/tools"
          api() { curl -fsSL -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" "$1"; }

          # Project_CTR publishes one release per tool, so search all of them.
          ctr=$(api "https://api.github.com/repos/3DSGuy/Project_CTR/releases?per_page=50")
          mk_url=$(echo "$ctr" | jq -r '[.[].assets[].browser_download_url | select(test("makerom.*(ubuntu|linux).*(x86_64|x64|amd64)"; "i"))][0] // empty')
          if [ -z "$mk_url" ]; then
            echo "::error::makerom Linux x86_64 빌드를 찾지 못했습니다. 릴리스 파일 목록:"
            echo "$ctr" | jq -r '.[].assets[].name'
            exit 1
          fi
          echo "makerom: $mk_url"
          curl -fsSL -o makerom.zip "$mk_url"
          unzip -o -q makerom.zip -d makerom
          makerom_bin=$(find "$PWD/makerom" -type f -name 'makerom*' ! -name '*.zip' | head -n 1)
          [ -n "$makerom_bin" ] || { echo "::error::makerom 실행 파일이 zip 안에 없습니다"; find makerom; exit 1; }
          chmod +x "$makerom_bin"

          bt=$(api "https://api.github.com/repos/Steveice10/bannertool/releases/latest")
          bt_url=$(echo "$bt" | jq -r '[.assets[].browser_download_url | select(test("bannertool.*\\.zip$"; "i"))][0] // empty')
          if [ -z "$bt_url" ]; then
            echo "::error::bannertool 릴리스를 찾지 못했습니다. 릴리스 파일 목록:"
            echo "$bt" | jq -r '.assets[].name'
            exit 1
          fi
          echo "bannertool: $bt_url"
          curl -fsSL -o bannertool.zip "$bt_url"
          unzip -o -q bannertool.zip -d bannertool
          bannertool_bin=$(find "$PWD/bannertool" -type f -path '*linux-x86_64*' -name 'bannertool' | head -n 1)
          [ -n "$bannertool_bin" ] || { echo "::error::bannertool linux-x86_64 실행 파일이 zip 안에 없습니다"; find bannertool; exit 1; }
          chmod +x "$bannertool_bin"

          echo "MAKEROM=$makerom_bin" >> "$GITHUB_ENV"
          echo "BANNERTOOL=$bannertool_bin" >> "$GITHUB_ENV"
          "$makerom_bin" -version 2>&1 | head -n 3 || true

      - name: Extract Korean source zip
        run: |
          set -eu
          zip=$(ls Kasumi*.zip 2>/dev/null | head -n 1 || true)
          [ -n "$zip" ] || { echo "::error::저장소 루트에 Kasumi 소스 zip이 없습니다"; exit 1; }
          mkdir -p work
          unzip -q "$zip" -d work
          makefile=$(find work -maxdepth 2 -name Makefile | head -n 1)
          [ -n "$makefile" ] || { echo "::error::zip 안에서 Makefile을 찾지 못했습니다"; exit 1; }
          echo "SRC=$(cd "$(dirname "$makefile")" && pwd)" >> "$GITHUB_ENV"

      - name: Adapt Windows paths for Linux
        run: |
          set -eu
          cd "$SRC"
          # The transport scripts were written for devkitPro MSYS on Windows.
          sed -i 's#/c/devkitPro#/opt/devkitpro#g; s#C:/devkitPro#/opt/devkitpro#g; s#\.exe\b##g' \
            tools/build-transport.sh tools/transport-toolchain.cmake
          # A newer devkitARM GCC can add warnings the author's version did not
          # have; do not let those stop the build.
          sed -i 's/ -Werror//' Makefile
          grep -n 'devkitpro\|devkitPro' tools/build-transport.sh tools/transport-toolchain.cmake

      - name: Build WebRTC transport and echo canceller
        run: |
          set -eu
          cd "$SRC"
          bash tools/build-transport.sh
          bash tools/build-aecm.sh

      - name: Build 3DSX and CIA
        run: |
          set -eu
          cd "$SRC"
          make -j4
          make cia MAKEROM="$MAKEROM" BANNERTOOL="$BANNERTOOL"
          ls -l Kasumi.cia Kasumi.3dsx
          sha256sum Kasumi.cia Kasumi.3dsx

      - uses: actions/upload-artifact@v4
        with:
          name: Kasumi-KO
          if-no-files-found: error
          path: |
            ${{ env.SRC }}/Kasumi.cia
            ${{ env.SRC }}/Kasumi.3dsx

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: kasumi-ko-build-${{ github.run_number }}
          name: Kasumi 1.1.2 한국어 (build ${{ github.run_number }})
          files: |
            ${{ env.SRC }}/Kasumi.cia
            ${{ env.SRC }}/Kasumi.3dsx
